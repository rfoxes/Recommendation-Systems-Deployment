[project]
name = "simula-api"
version = "2.0.0"
description = "Native ad serving API (Simula take-home)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic>=1.11.0",
    "fastapi>=0.115",
    "google-genai>=2.28.0",
    "lightgbm>=4.7.0",
    "maxminddb>=3.2.0",
    "numpy>=2.5.3",
    "openai>=3.25.0",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.18.2",
    "redis>=8.1.0",
    "temporalio>=1.34.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=2.13",
    "ruff>=0.16.10",
    "mypy>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs local MongoDB/Redis (docker compose up -d)"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
# LLM writers take a per-call `timeout` and apply it with asyncio.timeout inside (live serving uses 1.5 s,
# background generation 30 s), so the "use asyncio.timeout instead of a timeout parameter" rule doesn't fit.
ignore = ["ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]  # long Markdown/report strings

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["lightgbm.*", "maxminddb.*"]
ignore_missing_imports = true
