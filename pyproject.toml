[project]
name = "simula-api"
version = "0.1.0"
description = "Native ad serving API (Simula take-home)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic>=1.11.0",
    "fastapi>=0.115",
    "google-genai>=2.28.0",
    "lightgbm>=4.7.0",
    "maxminddb>=3.2.0",
    "numpy>=2.5.3",
    "openai>=3.25.0",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.18.2",
    "redis>=8.1.0",
    "temporalio>=1.34.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=2.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs local MongoDB/Redis (docker compose up -d)"]
