# Local infrastructure for development. Run the API itself with uvicorn from .venv.
services:
  mongo:
    image: mongo:8
    # Transactions need a replica set; a one-node set behaves like Atlas (which always is one).
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first start, then reports healthy once this node is primary.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}) }; quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 3s
      timeout: 10s
      retries: 30

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "7233:7233" # gRPC (the app's worker connects here)
      - "8233:8233" # web UI: http://localhost:8233

volumes:
  mongo-data:
